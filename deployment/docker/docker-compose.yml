# LiteLLM + Postgres (nono-cli baked in; entrypoint wraps proxy under `nono run`).
#
# Run from this directory:
#   cp .env.example .env && cp .env.secrets.example .env.secrets
#   # set keys; then:
#   ./scripts/compose-up.sh up -d                    # mode 1 (default)
#   LITELLM_NONO_MODE=sidecar ./scripts/compose-up.sh up -d   # mode 2
# Optional custom config: cp config.example.yaml config.yaml && set LITELLM_CONFIG_PATH=./config.yaml in .env
#
# Build image first: ../../scripts/build-local-image.sh vX.Y.Z-vA.B.C
#
# Threat model: put provider secrets only in NONO_* (not OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY).
# Do not paste provider keys into the Admin UI — use config os.environ/* phantoms only.
#
# Proxy: http://localhost:4000 (Admin UI login: user admin, password LITELLM_MASTER_KEY)
# Authorization: Bearer $LITELLM_MASTER_KEY

services:
  litellm:
    image: ${LITELLM_IMAGE:-bbkudk/litellm-secure:v1.106.8-v0.81.0}
    pull_policy: ${LITELLM_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile.template
      args:
        LITELLM_BASE_IMAGE: ${LITELLM_BASE_IMAGE:-ghcr.io/berriai/litellm-non_root:${LITELLM_RELEASE_TAG:-v1.106.8}}
        LITELLM_RELEASE_TAG: ${LITELLM_RELEASE_TAG:-v1.106.8}
        NONO_VERSION: ${NONO_VERSION:-0.81.0}
    container_name: litellm-secure
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_DISABLE_NO_REDIS_WARNING: "true"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-llmproxy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${DATABASE_HOST:-db}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-litellm}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      LITELLM_MIGRATION_DIR: /tmp/litellm-migrations
      # Prisma query engine must bind a fixed port (nono listen_port/open_port); sitecustomize.py reads this.
      LITELLM_PRISMA_ENGINE_PORT: ${LITELLM_PRISMA_ENGINE_PORT:-51245}
      STORE_MODEL_IN_DB: "False"
      # Migrations run unsandboxed in nono-entrypoint.sh; sandboxed proxy must not run prisma generate (Landlock + read-only venv).
      DISABLE_SCHEMA_UPDATE: "true"
      # In-container PgBouncer (loopback :6432); migrations use direct URL before the pooler starts in proxy_cli.
      LITELLM_PGBOUNCER_ENABLED: ${LITELLM_PGBOUNCER_ENABLED:-true}
      LITELLM_PGBOUNCER_PORT: ${LITELLM_PGBOUNCER_PORT:-6432}
      LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS: ${LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS:-10}
    env_file:
      - path: .env
        required: false
    command: ["--config", "/app/.staging/config.yaml"]
    volumes:
      - ${LITELLM_CONFIG_PATH:-./config.example.yaml}:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /app/.staging:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /app/.cache:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /app/.local/state/nono:uid=65534,gid=65534,mode=0700,size=64m,noexec,nosuid,nodev
      - /var/run/litellm:rw,noexec,nosuid,nodev,size=8m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  db:
    image: postgres:16
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-llmproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
    name: litellm_secure_postgres_data
