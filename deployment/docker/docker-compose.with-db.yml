# Use with: docker compose -f docker-compose.yml -f docker-compose.with-db.yml --profile with-db up -d
# Requires POSTGRES_PASSWORD, LITELLM_SALT_KEY, and related vars in .env (see .env.example).

services:
  litellm:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-llmproxy}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-litellm}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env for Postgres}
      LITELLM_MIGRATION_DIR: /tmp/litellm-migrations
      STORE_MODEL_IN_DB: "False" # keep provider keys in config os.environ/* phantoms only
      DISABLE_SCHEMA_UPDATE: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    profiles:
      - with-db
    image: postgres:16
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-llmproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
    name: litellm_secure_postgres_data
