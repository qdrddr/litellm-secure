# Mode 2 fragment: merge with docker-compose.yml (see scripts/compose-up.sh or docker-compose.with-nono-proxy.yml).
# Provider secrets: .env.secrets on nono-proxy only (NONO_* or NONO_REAL_*); litellm must not load .env.secrets.

services:
  nono-proxy:
    image: ghcr.io/nolabs-ai/nono:${NONO_VERSION:-0.81.0}
    container_name: litellm-nono-proxy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/nono/nono-proxy-entrypoint.sh"]
    env_file:
      - path: .env
        required: false
      - path: .env.secrets
        required: true
    environment:
      NONO_PROXY_PASS: ${NONO_PROXY_PASS:?set NONO_PROXY_PASS in .env for sidecar proxy auth}
      NONO_PROXY_LISTEN_PORT: ${NONO_PROXY_LISTEN_PORT:-4000}
    volumes:
      - ./nono/profiles/litellm-credentials.json:/profiles/litellm-credentials.json:ro
      - ./nono/litellm_nono_env.py:/nono/litellm_nono_env.py:ro
      - ./nono/nono-proxy-entrypoint.sh:/nono/nono-proxy-entrypoint.sh:ro
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O- "http://127.0.0.1:${NONO_PROXY_LISTEN_PORT:-4000}/" >/dev/null 2>&1 || wget -q --spider "http://127.0.0.1:${NONO_PROXY_LISTEN_PORT:-4000}/" 2>/dev/null || exit 0
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  litellm:
    depends_on:
      nono-proxy:
        condition: service_started
      db:
        condition: service_healthy
    env_file: !reset
      - path: .env
        required: false
    volumes:
      - ${NONO_PROFILE_PATH:-./nono/profiles/litellm-sandbox.json}:/root/.config/nono/profiles/litellm-sandbox.json:ro
      - ./nono/profiles/litellm-credentials.json:/app/credentials-sidecar-profile.json:ro
    environment:
      NONO_CREDENTIAL_PROXY: "1"
      NONO_CREDENTIAL_PROXY_HOST: ${NONO_CREDENTIAL_PROXY_HOST:-nono-proxy}
      NONO_CREDENTIAL_PROXY_PORT: ${NONO_CREDENTIAL_PROXY_PORT:-4000}
      NONO_LOCAL_CREDENTIAL_PROXY_PORT: ${NONO_LOCAL_CREDENTIAL_PROXY_PORT:-18080}
      NONO_CREDENTIALS_PROFILE_PATH: /app/credentials-sidecar-profile.json
      NONO_PROFILE: litellm-sandbox
      NONO_PROXY_PASS: ${NONO_PROXY_PASS:?set NONO_PROXY_PASS in .env for sidecar proxy auth}
