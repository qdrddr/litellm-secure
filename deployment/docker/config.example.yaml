# Example LiteLLM proxy config for nono phantom credentials (committed — baked into the image).
# Fresh clone: compose mounts this file by default (no config.yaml required).
# Customize: cp config.example.yaml config.yaml and set LITELLM_CONFIG_PATH=./config.yaml in .env
#
# OpenRouter: use os.environ/OPENROUTER_API_KEY + OPENROUTER_BASE_URL (nono loopback proxy).
# Do not set api_base to https://openrouter.ai — that bypasses injection.

model_list:
  - model_name: openrouter-gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OPENROUTER_BASE_URL

  # Optional OpenAI / Anthropic / Gemini (set matching SBX_REAL_* in .env.secrets):
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 600

# Example router fallbacks (see config.yaml for decide-all chains):
# router_settings:
#   fallbacks:
#     - primary-model:
#         - fallback-a
#         - fallback-b

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_prisma_schema_update: true
  # Clients hit :4000 directly (Compose publish); empty list silences login_throttle WARN.
  trusted_proxy_ranges: []
