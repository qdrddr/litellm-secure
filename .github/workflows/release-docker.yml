name: Release Docker Image

on:
  push:
    tags:
      - 'v*-v*'
  workflow_dispatch:
    inputs:
      release:
        description: Release name (canonical tag, e.g. v1.80.0-v0.81.0)
        required: true
        type: string
      litellm_tag:
        description: LiteLLM Hub image tag (default — semver from release tag without v)
        required: false
        type: string

concurrency:
  group: release-docker-${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${{ github.ref_name }}"
          else
            REF="${{ inputs.release }}"
          fi
          # shellcheck source=scripts/lib/parse-release-tag.sh
          source ./scripts/lib/parse-release-tag.sh
          parse_release_tag "$REF"
          LITELLM_TAG="${{ inputs.litellm_tag }}"
          if [[ -z "$LITELLM_TAG" ]]; then
            LITELLM_TAG="${BASE_TAG}"
          fi
          {
            echo "ref=${REF}"
            echo "base_tag=${BASE_TAG}"
            echo "nono_version=${NONO_VERSION}"
            echo "docker_tag=${DOCKER_TAG}"
            echo "litellm_tag=${LITELLM_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          DOCKER_IMAGE: bbkudk/litellm-secure
          LITELLM_TAG: ${{ steps.meta.outputs.litellm_tag }}
          NONO_VERSION: ${{ steps.meta.outputs.nono_version }}
          DOCKER_PLATFORMS: linux/amd64,linux/arm64
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: ./scripts/build-and-push-image.sh "${{ steps.meta.outputs.ref }}"

      - name: Verify manifest platforms
        run: |
          IMAGE="bbkudk/litellm-secure:${{ steps.meta.outputs.docker_tag }}"
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt

  create-release:
    if: github.event_name == 'push'
    needs: build-and-push
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
